name: Secure Windows Environment RDP

on:
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: windows-latest

    steps:
      - name: Configure System Security and RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          Set-Service -Name TermService -StartupType Automatic
          Restart-Service -Name TermService -Force

          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
          netsh advfirewall firewall add rule name="RDP-Inbound-3389" dir=in action=allow protocol=TCP localport=3389

      - name: Setup Administrator Account
        run: |
          $chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@"
          $bytes = New-Object byte[] 12
          (New-Object System.Security.Cryptography.RNGCryptoServiceProvider).GetBytes($bytes)
          $Password = "P@ss123" + (-join ($bytes | ForEach-Object { $chars[$_ % $chars.Length] }))
          $Username = "Administrator"
          
          net user $Username "$Password" /active:yes
          wmic useraccount where name="$Username" set passwordexpires=false
          net localgroup "Remote Desktop Users" $Username /add
          
          "RDP_USER=$Username" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RDP_PASS=$Password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure Personalization Dark Theme Desktop and Keyboard
        run: |
          $ThemePaths = @(
              "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize",
              "Registry::HKEY_USERS\.DEFAULT\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
          )
          foreach ($path in $ThemePaths) {
              if (-not (Test-Path $path)) { New-Item -Path $path -Force | Out-Null }
              Set-ItemProperty -Path $path -Name "AppsUseLightTheme" -Value 0 -Force
              Set-ItemProperty -Path $path -Name "SystemUsesLightTheme" -Value 0 -Force
          }

          $IconPaths = @(
              "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\NewStartPanel",
              "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\ClassicStartMenu",
              "Registry::HKEY_USERS\.DEFAULT\Software\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\NewStartPanel",
              "Registry::HKEY_USERS\.DEFAULT\Software\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\ClassicStartMenu"
          )
          foreach ($path in $IconPaths) {
              if (-not (Test-Path $path)) { New-Item -Path $path -Force | Out-Null }
              Set-ItemProperty -Path $path -Name "{20D04FE0-3AEA-1069-A2D8-08002B30309D}" -Value 0 -Force
          }

          $List = Get-WinUserLanguageList
          if (-not ($List | Where-Object { $_.LanguageTag -match "fa" })) {
              $List.Add("fa-IR")
              Set-WinUserLanguageList -LanguageList $List -Force
          }

          Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue

      - name: Install Brave Browser
        run: |
          $BraveUrl = "https://laptop-updates.brave.com/latest/winx64"
          $Installer = "$env:TEMP\BraveSetup.exe"
          Invoke-WebRequest -Uri $BraveUrl -OutFile $Installer
          Start-Process -FilePath $Installer -ArgumentList "/silent", "/install" -Wait
          Remove-Item -Path $Installer -Force -ErrorAction SilentlyContinue

      - name: Install Visual Studio Code
        run: |
          $VsCodeUrl = "https://update.code.visualstudio.com/latest/win32-x64-user/stable"
          $Installer = "$env:TEMP\vscode_setup.exe"
          Invoke-WebRequest -Uri $VsCodeUrl -OutFile $Installer
          Start-Process -FilePath $Installer -ArgumentList "/verysilent", "/norestart", "/MERGETASKS=!runcode" -Wait
          Remove-Item -Path $Installer -Force -ErrorAction SilentlyContinue

      - name: Install Internet Download Manager
        run: |
          $IdmUrl = "https://mirror2.internetdownloadmanager.com/idman642build25.exe"
          $Installer = "$env:TEMP\idm_setup.exe"
          Invoke-WebRequest -Uri $IdmUrl -OutFile $Installer -UserAgent "Mozilla/5.0"
          $proc = Start-Process -FilePath $Installer -ArgumentList "/s" -PassThru
          Start-Sleep -Seconds 15
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          Get-Process -Name "idman*","IEMonitor*" -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item -Path $Installer -Force -ErrorAction SilentlyContinue

      - name: Install and Register 3x-ui Service
        run: |
          $3xUiUrl = "https://github.com/MHSanaei/3x-ui/releases/download/v3.6.0/x-ui-windows-amd64.zip"
          $ZipPath = "$env:TEMP\3x-ui.zip"
          $ExtractPath = "C:\3x-ui"
          
          Invoke-WebRequest -Uri $3xUiUrl -OutFile $ZipPath
          Expand-Archive -Path $ZipPath -DestinationPath $ExtractPath -Force
          Remove-Item -Path $ZipPath -Force -ErrorAction SilentlyContinue
          
          if (Test-Path "$ExtractPath\x-ui.exe") {
              $action = New-ScheduledTaskAction -Execute "$ExtractPath\x-ui.exe" -WorkingDirectory $ExtractPath
              $trigger = New-ScheduledTaskTrigger -AtStartup
              $principal = New-ScheduledTaskPrincipal -UserId "NT AUTHORITY\SYSTEM" -LogonType ServiceAccount -RunLevel Highest
              Register-ScheduledTask -TaskName "3x-ui-Service" -Action $action -Trigger $trigger -Principal $principal -Force
              Start-ScheduledTask -TaskName "3x-ui-Service"
          }

      - name: Deploy Tailscale Network
        run: |
          $TsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $Installer = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $TsUrl -OutFile $Installer
          Start-Process msiexec.exe -ArgumentList "/i", $Installer, "/quiet", "/norestart" -Wait
          Remove-Item -Path $Installer -Force -ErrorAction SilentlyContinue
          
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=win-server-$env:GITHUB_RUN_ID
          
          $TsIP = $null
          for ($i = 0; $i -lt 12 -and -not $TsIP; $i++) {
              Start-Sleep -Seconds 5
              $TsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          }
          
          if ($TsIP) {
              "TAILSCALE_IP=$TsIP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Verify Infrastructure and Keep Alive
        if: always()
        run: |
          Write-Host "=================================================="
          Write-Host "         SECURE RDP SESSION ESTABLISHED          "
          Write-Host "=================================================="
          Write-Host " Tailscale IP : $env:TAILSCALE_IP"
          Write-Host " RDP Port     : 3389"
          Write-Host " Username     : $env:RDP_USER"
          Write-Host " Password     : $env:RDP_PASS"
          Write-Host "=================================================="
          
          while ($true) {
              Start-Sleep -Seconds 3600
          }
